<svg width="1180" height="210" viewBox="0 0 1180 210" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Multi-stop Aurora Wave Gradient -->
    <linearGradient id="auroraGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="25%" stop-color="#FB7185"/>
      <stop offset="60%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="auroraGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Aesthetic Shimmering Title Gradient -->
    <linearGradient id="titleShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="30%" stop-color="#F43F5E"/>
      <stop offset="65%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Glass Pill Gradients -->
    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="pillGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="pillGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="pillGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes subtleFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-2px); }
    }
    @keyframes pulseGlow {
      0%, 100% { filter: drop-shadow(0 0 10px rgba(168, 85, 247, 0.4)); }
      50% { filter: drop-shadow(0 0 18px rgba(251, 113, 133, 0.6)); }
    }
    .main-bg { fill: #080D1A; }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
      font-size: 35px;
      font-weight: 800;
      fill: url(#titleShimmer);
      letter-spacing: -0.5px;
      animation: pulseGlow 5s infinite ease-in-out;
    }
    .sub-text {
      font-family: 'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace;
      font-size: 14.5px;
      font-weight: 500;
      fill: #E2E8F0;
      letter-spacing: 0.2px;
    }
    .badge-text {
      font-family: 'Fira Code', 'Cascadia Code', monospace;
      font-size: 12px;
      font-weight: 700;
    }

    @media (prefers-color-scheme: light) {
      .main-bg { fill: #F8FAFC; }
      .sub-text { fill: #334155; }
    }
  </style>

  <!-- Container Box with Rounded Aesthetic Border -->
  <rect width="1180" height="210" rx="16" class="main-bg"/>
  <rect x="1" y="1" width="1178" height="208" rx="15" fill="none" stroke="url(#auroraGrad1)" stroke-width="1.8"/>

  <!-- Layered Aurora Mesh Waves -->
  <path d="M 0 55 C 220 15, 450 75, 680 35 C 880 0, 1050 60, 1180 25 L 1180 0 L 0 0 Z" fill="url(#auroraGrad1)" opacity="0.28"/>
  <path d="M 0 40 C 320 65, 640 10, 920 50 C 1040 68, 1130 30, 1180 40 L 1180 0 L 0 0 Z" fill="url(#auroraGrad2)" opacity="0.35"/>
  <path d="M 1180 185 C 960 205, 730 165, 500 195 C 300 220, 120 175, 0 190 L 0 210 L 1180 210 Z" fill="url(#auroraGrad1)" opacity="0.12"/>

  <!-- Main Center Header Text -->
  <g transform="translate(590, 84)" text-anchor="middle">
    <text x="0" y="0" class="title-text">✨ Hello, World! I'm Manindra Babu 👋</text>
    <text x="0" y="34" class="sub-text">
      <tspan fill="#F59E0B">⚡ Full-Stack Developer</tspan>
      <tspan fill="#64748B"> &bull; </tspan>
      <tspan fill="#FB7185">🤖 AI/ML Engineer</tspan>
      <tspan fill="#64748B"> &bull; </tspan>
      <tspan fill="#22D3EE">🚀 Building Intelligent Automations</tspan>
    </text>
  </g>

  <!-- Aesthetic Floating Tag Pills -->
  <g transform="translate(590, 166)">
    <!-- Pill 1: AI & ML Systems -->
    <g transform="translate(-320, 0)">
      <rect x="-80" y="-15" width="160" height="30" rx="15" fill="url(#pillGrad1)" stroke="#A855F7" stroke-opacity="0.7" stroke-width="1.2"/>
      <text x="0" y="5" text-anchor="middle" fill="#E9D5FF" class="badge-text">🧠 AI &amp; ML Models</text>
    </g>

    <!-- Pill 2: Full-Stack Web -->
    <g transform="translate(-105, 0)">
      <rect x="-82" y="-15" width="164" height="30" rx="15" fill="url(#pillGrad2)" stroke="#F59E0B" stroke-opacity="0.7" stroke-width="1.2"/>
      <text x="0" y="5" text-anchor="middle" fill="#FEF08A" class="badge-text">⚡ Full-Stack Dev</text>
    </g>

    <!-- Pill 3: RAG & Multi-Agent -->
    <g transform="translate(115, 0)">
      <rect x="-95" y="-15" width="190" height="30" rx="15" fill="url(#pillGrad3)" stroke="#10B981" stroke-opacity="0.7" stroke-width="1.2"/>
      <text x="0" y="5" text-anchor="middle" fill="#A7F3D0" class="badge-text">🚀 Multi-Agent &amp; RAG</text>
    </g>

    <!-- Pill 4: Open Source & Scalable Tech -->
    <g transform="translate(325, 0)">
      <rect x="-75" y="-15" width="150" height="30" rx="15" fill="url(#pillGrad4)" stroke="#06B6D4" stroke-opacity="0.7" stroke-width="1.2"/>
      <text x="0" y="5" text-anchor="middle" fill="#BAE6FD" class="badge-text">🌐 Open Source</text>
    </g>
  </g>
</svg>