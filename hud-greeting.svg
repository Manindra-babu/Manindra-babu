<svg width="1180" height="175" viewBox="0 0 1180 175" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hudBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#EC4899" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes pulseLive {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .hud-bg { fill: #0A101F; }
    .hud-header { fill: #0F172A; fill-opacity: 0.8; }
    .hud-title { fill: #94A3B8; font-family: 'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500; }
    .code-prompt { fill: #F59E0B; font-family: 'Fira Code', 'Cascadia Code', monospace; font-size: 15px; font-weight: 700; }
    .code-cmd { fill: #38BDF8; font-family: 'Fira Code', 'Cascadia Code', monospace; font-size: 15px; font-weight: 600; }
    .code-string { fill: #FDE047; font-family: 'Fira Code', 'Cascadia Code', monospace; font-size: 15px; font-weight: 700; }
    .label-role { fill: #FB7185; font-family: 'Fira Code', 'Cascadia Code', monospace; font-size: 14px; font-weight: 700; }
    .val-role { fill: #E2E8F0; font-family: 'Fira Code', 'Cascadia Code', monospace; font-size: 14px; font-weight: 500; }
    .label-focus { fill: #34D399; font-family: 'Fira Code', 'Cascadia Code', monospace; font-size: 14px; font-weight: 700; }
    .val-focus { fill: #CBD5E1; font-family: 'Fira Code', 'Cascadia Code', monospace; font-size: 14px; font-weight: 500; }
    .cursor-box { fill: #F59E0B; animation: cursorBlink 0.9s infinite; }
    .live-dot { fill: #10B981; animation: pulseLive 1.8s infinite ease-in-out; }
    .live-text { fill: #10B981; font-family: 'Fira Code', monospace; font-size: 11px; font-weight: 700; }

    @media (prefers-color-scheme: light) {
      .hud-bg { fill: #F8FAFC; }
      .hud-header { fill: #E2E8F0; fill-opacity: 0.9; }
      .hud-title { fill: #64748B; }
      .val-role { fill: #1E293B; }
      .val-focus { fill: #334155; }
      .code-string { fill: #D97706; }
    }
  </style>

  <!-- Container Box -->
  <rect width="1180" height="175" rx="12" class="hud-bg"/>
  <rect x="1" y="1" width="1178" height="173" rx="11" fill="none" stroke="url(#hudBorder)" stroke-width="1.8"/>

  <!-- Title Bar -->
  <path d="M 0 12 Q 0 0 12 0 L 1168 0 Q 1180 0 1180 12 L 1180 38 L 0 38 Z" class="hud-header"/>
  
  <!-- Mac Window Dots -->
  <circle cx="28" cy="19" r="6" fill="#EF4444"/>
  <circle cx="48" cy="19" r="6" fill="#F59E0B"/>
  <circle cx="68" cy="19" r="6" fill="#10B981"/>

  <!-- Center Title -->
  <text x="590" y="24" text-anchor="middle" class="hud-title">welcome.sh --mode="interactive"</text>

  <!-- Live Status Pill -->
  <rect x="1070" y="9" width="85" height="20" rx="10" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.4"/>
  <circle cx="1084" cy="19" r="3.5" class="live-dot"/>
  <text x="1114" y="23" text-anchor="middle" class="live-text">ONLINE</text>

  <!-- Terminal Content Lines -->
  <!-- Line 1: Command & Greeting -->
  <g transform="translate(32, 70)">
    <text x="0" y="0" class="code-prompt">$</text>
    <text x="20" y="0" class="code-cmd">manindra.greet()</text>
    <text x="180" y="0" fill="#94A3B8" font-family="monospace" font-size="15">→</text>
    <text x="205" y="0" class="code-string">"Hi there, I'm Manindra Babu! 👋"</text>
  </g>

  <!-- Line 2: Role Info -->
  <g transform="translate(32, 108)">
    <text x="0" y="0" class="label-role">⚡ [ROLE]:</text>
    <text x="110" y="0" class="val-role">Full-Stack Developer &amp; AI/ML Engineer</text>
  </g>

  <!-- Line 3: Focus & Mission -->
  <g transform="translate(32, 144)">
    <text x="0" y="0" class="label-focus">🚀 [FOCUS]:</text>
    <text x="110" y="0" class="val-focus">LLMs, Multi-Agent Systems &amp; Scalable Cloud Architectures</text>
    <rect x="710" y="-14" width="9" height="17" class="cursor-box"/>
  </g>
</svg>